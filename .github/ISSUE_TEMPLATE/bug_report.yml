name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description plus the command / utterance you tried.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations: { required: true }
  - type: input
    id: device
    attributes:
      label: Device / OS
      placeholder: "iPhone 15 Pro, iOS 18.2"
  - type: textarea
    id: logs
    attributes:
      label: Server log (last 30 lines)
      render: shell
