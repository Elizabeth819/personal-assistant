[project]
name = "personal-assistant"
version = "0.1.0"
description = "Personal AI assistant: long-term memory + multi-device executor"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "wanmeng" }]
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "websockets>=16.0",
    "sounddevice>=0.5.5",
    "numpy>=2.4.4",
    "python-multipart>=0.0.28",
    "appium-python-client>=4",
    "zeroconf>=0.140.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipython>=8.28.0",
]

[project.scripts]
pa = "pa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pa"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=src/pa --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/pa"]
