<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="助理">
<link rel="apple-touch-icon" href="/static/icon.png">
<title>助理</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07070a;
    --bg-grad: radial-gradient(120% 80% at 50% -10%, #1a1f3a 0%, #0a0a12 45%, #07070a 100%);
    --surface: rgba(255,255,255,.04);
    --surface-2: rgba(255,255,255,.07);
    --border: rgba(255,255,255,.08);
    --text: #f5f5f7;
    --text-dim: rgba(245,245,247,.55);
    --text-mute: rgba(245,245,247,.35);
    --accent: #6366f1;
    --accent-2: #a855f7;
    --accent-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
    --user-grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --rec: #ff3b5c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    overflow:hidden;touch-action:manipulation;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{background:var(--bg-grad);background-attachment:fixed}

  /* Top bar */
  #topbar{position:absolute;top:0;left:0;right:0;height:calc(54px + var(--safe-top));
    padding:calc(var(--safe-top) + 10px) 18px 8px;
    display:flex;align-items:center;justify-content:space-between;
    backdrop-filter:saturate(140%) blur(18px);-webkit-backdrop-filter:saturate(140%) blur(18px);
    background:linear-gradient(180deg, rgba(7,7,10,.7) 0%, rgba(7,7,10,0) 100%);
    z-index:10}
  #brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.3px}
  #brand .dot{width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,#10b981,#34d399);
    box-shadow:0 0 12px rgba(52,211,153,.6)}
  #status{font-size:12px;color:var(--text-dim);
    padding:5px 10px;border-radius:999px;background:var(--surface);
    border:1px solid var(--border);font-weight:500;
    transition:color .2s,background .2s}
  #status.busy{color:#fbbf24;background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.2)}
  #status.err{color:#f87171;background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.2)}
  #status.ok{color:#34d399}

  /* Log */
  #log{position:absolute;top:calc(54px + var(--safe-top));left:0;right:0;bottom:268px;
    overflow-y:auto;overflow-x:hidden;padding:8px 14px 24px;
    -webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  #log::-webkit-scrollbar{width:0}

  #empty{text-align:center;color:var(--text-mute);padding:42px 24px 0;
    display:flex;flex-direction:column;align-items:center;gap:18px}
  #empty .logo{width:64px;height:64px;border-radius:18px;
    background:var(--accent-grad);display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:800;color:#fff;
    box-shadow:0 8px 32px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.2)}
  #empty h2{font-size:20px;margin:6px 0 0;color:var(--text);font-weight:600}
  #empty p{margin:0;font-size:13px;line-height:1.6;max-width:260px}
  #suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;max-width:320px}
  #suggestions button{flex:0 1 auto;font-size:13px;padding:8px 14px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    font-weight:500;cursor:pointer;transition:all .15s;
    -webkit-appearance:none}
  #suggestions button:active{transform:scale(.96);background:var(--surface-2);color:var(--text)}

  .turn{margin:6px 0;display:flex;flex-direction:column;animation:rise .25s ease-out}
  .turn.u{align-items:flex-end}
  .turn.a{align-items:flex-start}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .bubble{padding:11px 14px;border-radius:18px;max-width:84%;
    font-size:15px;line-height:1.45;word-wrap:break-word;
    box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .turn.u .bubble{background:var(--user-grad);color:#fff;border-bottom-right-radius:6px;
    box-shadow:0 4px 16px rgba(99,102,241,.25)}
  .turn.a .bubble{background:var(--surface-2);color:var(--text);border-bottom-left-radius:6px;
    border:1px solid var(--border);backdrop-filter:blur(8px)}
  .meta{font-size:11px;color:var(--text-mute);margin-top:5px;padding:0 4px;
    font-feature-settings:"tnum";letter-spacing:.2px;max-width:84%;
    display:flex;flex-wrap:wrap;gap:6px}
  .meta .chip{background:var(--surface);padding:2px 8px;border-radius:6px;
    border:1px solid var(--border);font-size:10.5px}

  .typing{display:inline-flex;gap:4px;padding:4px 0}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-dim);
    animation:bounce 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  /* Bottom panel */
  #bottom{position:absolute;left:0;right:0;bottom:0;
    padding:16px 14px calc(14px + var(--safe-bot));
    background:linear-gradient(180deg, rgba(7,7,10,0) 0%, rgba(7,7,10,.85) 30%, var(--bg) 100%);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:flex;flex-direction:column;gap:10px;z-index:5}

  #inputrow{display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:24px;
    padding:6px 6px 6px 16px;transition:border-color .15s, background .15s}
  #inputrow:focus-within{border-color:rgba(99,102,241,.5);background:var(--surface-2)}
  #txt{flex:1;background:transparent;color:var(--text);border:0;outline:none;
    font:15px/1.4 inherit;padding:9px 0;min-width:0}
  #txt::placeholder{color:var(--text-mute)}
  #send{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:0;
    background:var(--accent-grad);color:#fff;font-size:18px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .15s, opacity .15s;opacity:.5;-webkit-appearance:none}
  #send.active{opacity:1}
  #send:active{transform:scale(.92)}

  #toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
  #toggles{display:flex;gap:8px}
  .tgl{font-size:12.5px;padding:6px 12px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    font-weight:500;cursor:pointer;-webkit-appearance:none;transition:all .15s}
  .tgl.on{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4);color:#a5b4fc}
  .tgl:active{transform:scale(.96)}
  #reset{color:var(--text-mute);background:transparent;border:0;font-size:12.5px;
    padding:6px 4px;cursor:pointer;font-weight:500}
  #reset:active{color:var(--text-dim)}

  /* Mic */
  #miczone{display:flex;justify-content:center;padding-top:4px}
  #mic{width:72px;height:72px;border-radius:50%;border:0;
    background:var(--accent-grad);color:#fff;
    font-size:13px;font-weight:600;letter-spacing:.5px;cursor:pointer;
    box-shadow:0 8px 28px rgba(99,102,241,.45), inset 0 1px 0 rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;
    transition:transform .12s, box-shadow .15s, background .2s;
    position:relative;-webkit-appearance:none;user-select:none}
  #mic .icon{font-size:22px;line-height:1}
  #mic .label{font-size:10.5px;opacity:.9}
  #mic:active{transform:scale(.96)}
  #mic.rec{background:linear-gradient(135deg, #ff3b5c, #ff6b35);
    box-shadow:0 0 0 8px rgba(255,59,92,.18), 0 8px 28px rgba(255,59,92,.5);
    animation:pulse 1.4s infinite ease-in-out}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 8px rgba(255,59,92,.18), 0 8px 28px rgba(255,59,92,.5)}
    50%{box-shadow:0 0 0 16px rgba(255,59,92,.05), 0 8px 28px rgba(255,59,92,.5)}
  }
</style>
</head>
<body>
<div id="topbar">
  <div id="brand"><span class="dot"></span>助理</div>
  <div id="status">就绪</div>
</div>

<div id="log">
  <div id="empty">
    <div class="logo">助</div>
    <div>
      <h2>你的私人 AI 助理</h2>
      <p>可以开 app、查天气、控制屏幕、记住你的偏好。试试看 ↓</p>
    </div>
    <div id="suggestions">
      <button>北京明天天气</button>
      <button>打开淘宝搜 AirPods</button>
      <button>我女朋友几号生日</button>
      <button>5分钟后提醒我喝水</button>
    </div>
  </div>
</div>

<div id="bottom">
  <div id="inputrow">
    <input id="txt" placeholder="问点什么…" autocomplete="off" enterkeyhint="send">
    <button id="send" aria-label="发送">↑</button>
  </div>
  <div id="toolbar">
    <div id="toggles">
      <button class="tgl on" id="autorun">⚡ 自动执行</button>
    </div>
    <button id="reset">清空对话</button>
  </div>
  <div id="miczone">
    <button id="mic"><span class="icon">🎙</span><span class="label">按住说话</span></button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const txt = document.getElementById('txt');
const sendBtn = document.getElementById('send');
const mic = document.getElementById('mic');
const micLabel = mic.querySelector('.label');
const micIcon = mic.querySelector('.icon');
const autoBtn = document.getElementById('autorun');
const statusEl = document.getElementById('status');
let autorun = true;
let mr, chunks=[], audioEl;

let sessionId = localStorage.getItem('pa_sid');
if(!sessionId){
  sessionId = 's_' + Math.random().toString(36).slice(2,10);
  localStorage.setItem('pa_sid', sessionId);
}

function setStatus(text, kind=''){
  statusEl.textContent = text;
  statusEl.className = kind;
}

function hideEmpty(){ if(empty) empty.style.display = 'none'; }

function escape(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function add(role, text, meta){
  hideEmpty();
  const wrap = document.createElement('div');
  wrap.className = 'turn ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  wrap.appendChild(b);
  if(meta && meta.length){
    const m = document.createElement('div');
    m.className = 'meta';
    meta.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = c;
      m.appendChild(chip);
    });
    wrap.appendChild(m);
  }
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function addTyping(){
  hideEmpty();
  const wrap = document.createElement('div');
  wrap.className = 'turn a';
  wrap.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function summary(j){
  const chips = [];
  (j.actions||[]).filter(a=>a.type!=='say').forEach(a=>{
    if(a.type==='open_app') chips.push('📱 '+a.app);
    else if(a.type==='set_timer') chips.push('⏱ '+a.seconds+'s '+(a.label||''));
    else if(a.type==='play_music') chips.push('🎵 '+(a.query||''));
    else if(a.type==='navigate') chips.push('🧭 '+a.destination);
    else if(a.type==='open_url') chips.push('🔗 '+(a.url||'').slice(0,40));
    else if(a.type==='tap_text') chips.push('👆 '+a.text);
    else if(a.type==='type_text') chips.push('⌨️ '+a.text);
    else if(a.type==='swipe') chips.push('↕️ '+a.direction);
    else if(a.type==='weather') chips.push('🌦 '+(a.city||''));
    else if(a.type==='screen_explain') chips.push('👁 看屏幕');
    else chips.push(a.type);
  });
  const dr = (j.device_results||[]);
  if(dr.length){
    const ok = dr.filter(r=>r.ok).length;
    const failed = dr.filter(r=>r.ok===false).length;
    chips.push(`${ok}✓${failed?' '+failed+'✗':''}`);
  }
  return chips;
}

async function sendText(t){
  if(!t.trim()) return;
  add('u', t);
  setStatus('思考中…','busy');
  const typing = addTyping();
  const fd = new FormData();
  fd.append('text', t);
  fd.append('autorun', autorun ? 'true' : 'false');
  fd.append('session_id', sessionId);
  try{
    const r = await fetch('/voice/text', {method:'POST', body:fd});
    const j = await r.json();
    typing.remove();
    add('a', j.reply_text || '(空回复)', summary(j));
    setStatus('就绪','ok');
    setTimeout(()=>setStatus('就绪',''), 1500);
  }catch(e){
    typing.remove();
    add('a', '错误: '+e.message);
    setStatus('错误','err');
  }
}

async function sendAudio(blob){
  add('u','🎙 录音 '+(blob.size/1024).toFixed(1)+' KB');
  setStatus('识别中…','busy');
  const typing = addTyping();
  const fd = new FormData();
  fd.append('audio', blob, 'rec.m4a');
  fd.append('autorun', autorun ? 'true' : 'false');
  fd.append('audio_format','b64');
  fd.append('session_id', sessionId);
  try{
    const r = await fetch('/voice/turn', {method:'POST', body:fd});
    const j = await r.json();
    typing.remove();
    if(j.user_text){
      // replace the placeholder user bubble's last entry
      const turns = log.querySelectorAll('.turn.u .bubble');
      if(turns.length){ turns[turns.length-1].textContent = j.user_text; }
    }
    add('a', j.reply_text||'', summary(j));
    if(j.audio_wav_b64){
      audioEl?.pause();
      audioEl = new Audio('data:audio/wav;base64,'+j.audio_wav_b64);
      audioEl.play().catch(()=>{});
    }
    setStatus('就绪','ok');
    setTimeout(()=>setStatus('就绪',''), 1500);
  }catch(e){
    typing.remove();
    add('a','错误: '+e.message);
    setStatus('错误','err');
  }
}

function updateSendActive(){
  sendBtn.classList.toggle('active', txt.value.trim().length > 0);
}
txt.addEventListener('input', updateSendActive);
sendBtn.onclick = ()=>{ const t=txt.value; txt.value=''; updateSendActive(); sendText(t); };
txt.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendBtn.click(); }});

autoBtn.onclick = ()=>{
  autorun = !autorun;
  autoBtn.classList.toggle('on', autorun);
  autoBtn.textContent = (autorun?'⚡':'⚙️') + ' 自动执行' + (autorun?'':' 关');
};

document.getElementById('reset').onclick = async ()=>{
  const fd = new FormData(); fd.append('session_id', sessionId);
  try{ await fetch('/session/reset', {method:'POST', body:fd}); }catch(e){}
  log.innerHTML = '';
  log.appendChild(empty); empty.style.display = '';
  setStatus('已清空','ok');
  setTimeout(()=>setStatus('就绪',''), 1200);
};

document.querySelectorAll('#suggestions button').forEach(b=>{
  b.onclick = ()=>{ txt.value = b.textContent; updateSendActive(); sendBtn.click(); };
});

async function startRec(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
    mr = new MediaRecorder(stream, {mimeType: mime});
    chunks = [];
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = ()=>{
      const blob = new Blob(chunks, {type: mime});
      stream.getTracks().forEach(t=>t.stop());
      sendAudio(blob);
    };
    mr.start();
    mic.classList.add('rec');
    micIcon.textContent = '⏹';
    micLabel.textContent = '松开发送';
    setStatus('录音中…','busy');
    if(navigator.vibrate) navigator.vibrate(8);
  }catch(e){
    setStatus('麦克风失败','err');
  }
}
function stopRec(){
  if(mr && mr.state !== 'inactive'){ mr.stop(); }
  mic.classList.remove('rec');
  micIcon.textContent = '🎙';
  micLabel.textContent = '按住说话';
  if(navigator.vibrate) navigator.vibrate(8);
}
mic.addEventListener('touchstart', e=>{e.preventDefault();startRec();});
mic.addEventListener('touchend',   e=>{e.preventDefault();stopRec();});
mic.addEventListener('touchcancel',e=>{e.preventDefault();stopRec();});
mic.addEventListener('mousedown',  startRec);
mic.addEventListener('mouseup',    stopRec);
mic.addEventListener('mouseleave', stopRec);
</script>
</body>
</html>
