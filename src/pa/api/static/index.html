<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="助理">
<link rel="apple-touch-icon" href="/static/icon.png">
<title>助理</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0c0c;
    --surface: #161616;
    --surface-2: #1c1c1c;
    --border: #232323;
    --border-strong: #2e2e2e;
    --text: #ededed;
    --text-dim: #9b9b9b;
    --text-mute: #5f5f5f;
    --accent: #d4d4d4;
    --user-bubble: #2a2a2a;
    --rec: #e5484d;
    --green: #30a46c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    overflow:hidden;touch-action:manipulation;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

  /* Top bar */
  #topbar{position:absolute;top:0;left:0;right:0;height:calc(48px + var(--safe-top));
    padding:calc(var(--safe-top) + 4px) 18px 0;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(12,12,12,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);z-index:10}
  #brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.2px}
  #brand .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
  #status{font-size:12px;color:var(--text-dim);font-weight:500;letter-spacing:.1px;
    transition:color .15s}
  #status.busy{color:#f5a623}
  #status.err{color:var(--rec)}
  #status.ok{color:var(--green)}

  /* Log */
  #log{position:absolute;top:calc(48px + var(--safe-top));left:0;right:0;bottom:248px;
    overflow-y:auto;overflow-x:hidden;padding:20px 16px 24px;
    -webkit-overflow-scrolling:touch}
  #log::-webkit-scrollbar{width:0}

  #empty{text-align:center;color:var(--text-dim);padding:64px 24px 0;
    display:flex;flex-direction:column;align-items:center;gap:24px}
  #empty .logo{width:48px;height:48px;border-radius:12px;
    background:var(--surface-2);border:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:600;color:var(--text);letter-spacing:-.5px}
  #empty h2{font-size:17px;margin:0;color:var(--text);font-weight:600;letter-spacing:-.3px}
  #empty p{margin:6px 0 0;font-size:13.5px;line-height:1.55;max-width:260px;color:var(--text-mute)}
  #suggestions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;margin-top:6px}
  #suggestions button{font-size:14px;padding:11px 14px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    font-weight:500;cursor:pointer;text-align:left;
    -webkit-appearance:none;font-family:inherit}
  #suggestions button:active{background:var(--surface-2);color:var(--text)}

  .turn{margin:14px 0;display:flex;flex-direction:column;animation:rise .2s ease-out}
  .turn.u{align-items:flex-end}
  .turn.a{align-items:flex-start}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  .bubble{padding:10px 14px;border-radius:14px;max-width:84%;
    font-size:15px;line-height:1.45;word-wrap:break-word;letter-spacing:-.1px}
  .turn.u .bubble{background:var(--user-bubble);color:var(--text);border-bottom-right-radius:4px}
  .turn.a .bubble{background:transparent;color:var(--text);padding:2px 0;max-width:100%}
  .meta{font-size:11.5px;color:var(--text-mute);margin-top:6px;
    font-feature-settings:"tnum";letter-spacing:.1px;
    display:flex;flex-wrap:wrap;gap:6px}
  .meta .chip{padding:2px 8px;border-radius:5px;
    background:var(--surface);border:1px solid var(--border);
    font-size:11px;color:var(--text-dim);font-weight:500}

  .typing{display:inline-flex;gap:4px;padding:2px 0}
  .typing span{width:5px;height:5px;border-radius:50%;background:var(--text-mute);
    animation:bounce 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* Bottom panel */
  #bottom{position:absolute;left:0;right:0;bottom:0;
    padding:14px 16px calc(12px + var(--safe-bot));
    background:rgba(12,12,12,.92);backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);
    display:flex;flex-direction:column;gap:10px;z-index:5}

  #inputrow{display:flex;align-items:flex-end;gap:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:4px 4px 4px 14px;transition:border-color .12s}
  #inputrow:focus-within{border-color:var(--border-strong)}
  #txt{flex:1;background:transparent;color:var(--text);border:0;outline:none;
    font:15px/1.45 inherit;padding:9px 0;min-width:0;
    -webkit-appearance:none}
  #txt::placeholder{color:var(--text-mute)}
  #send{flex:0 0 auto;width:32px;height:32px;border-radius:8px;border:0;
    background:var(--text);color:var(--bg);font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:opacity .12s, transform .12s;opacity:.3;-webkit-appearance:none}
  #send.active{opacity:1}
  #send:active{transform:scale(.94)}

  #toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
  #autorun{font-size:12.5px;padding:5px 10px 5px 8px;border-radius:8px;
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    font-weight:500;cursor:pointer;-webkit-appearance:none;
    display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  #autorun:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--text-mute)}
  #autorun.on{border-color:var(--border-strong);color:var(--text)}
  #autorun.on:before{background:var(--green)}
  #reset{color:var(--text-mute);background:transparent;border:0;font-size:12.5px;
    padding:6px 4px;cursor:pointer;font-weight:500;font-family:inherit}
  #reset:active{color:var(--text-dim)}

  /* Mic */
  #miczone{display:flex;justify-content:center;padding-top:2px}
  #mic{width:60px;height:60px;border-radius:50%;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s, background .15s, border-color .15s;
    -webkit-appearance:none;user-select:none;padding:0}
  #mic svg{width:22px;height:22px;fill:currentColor}
  #mic:active{transform:scale(.94)}
  #mic.rec{background:var(--rec);border-color:var(--rec);color:#fff;
    box-shadow:0 0 0 6px rgba(229,72,77,.16);
    animation:pulse 1.4s infinite ease-in-out}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 6px rgba(229,72,77,.16)}
    50%{box-shadow:0 0 0 12px rgba(229,72,77,.04)}
  }
</style>
</head>
<body>
<div id="topbar">
  <div id="brand"><span class="dot"></span>助理</div>
  <div id="status">就绪</div>
</div>

<div id="log">
  <div id="empty">
    <div class="logo">助</div>
    <div>
      <h2>你的私人助理</h2>
      <p>能开 app · 控制屏幕 · 查天气 · 记得你说过的话</p>
    </div>
    <div id="suggestions">
      <button>北京明天天气</button>
      <button>打开淘宝搜 AirPods</button>
      <button>我女朋友几号生日</button>
      <button>5 分钟后提醒我喝水</button>
    </div>
  </div>
</div>

<div id="bottom">
  <div id="inputrow">
    <input id="txt" placeholder="发消息…" autocomplete="off" enterkeyhint="send">
    <button id="send" aria-label="发送">↑</button>
  </div>
  <div id="toolbar">
    <button class="on" id="autorun">自动执行</button>
    <button id="reset">清空对话</button>
  </div>
  <div id="miczone">
    <button id="mic" aria-label="按住说话">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const txt = document.getElementById('txt');
const sendBtn = document.getElementById('send');
const mic = document.getElementById('mic');
const autoBtn = document.getElementById('autorun');
const statusEl = document.getElementById('status');
let autorun = true;
let mr, chunks=[], audioEl;

let sessionId = localStorage.getItem('pa_sid');
if(!sessionId){
  sessionId = 's_' + Math.random().toString(36).slice(2,10);
  localStorage.setItem('pa_sid', sessionId);
}

function setStatus(text, kind=''){ statusEl.textContent = text; statusEl.className = kind; }
function hideEmpty(){ if(empty) empty.style.display = 'none'; }

function add(role, text, meta){
  hideEmpty();
  const wrap = document.createElement('div');
  wrap.className = 'turn ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  wrap.appendChild(b);
  if(meta && meta.length){
    const m = document.createElement('div');
    m.className = 'meta';
    meta.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = c;
      m.appendChild(chip);
    });
    wrap.appendChild(m);
  }
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function addTyping(){
  hideEmpty();
  const wrap = document.createElement('div');
  wrap.className = 'turn a';
  wrap.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function summary(j){
  const chips = [];
  (j.actions||[]).filter(a=>a.type!=='say').forEach(a=>{
    if(a.type==='open_app') chips.push(a.app);
    else if(a.type==='set_timer') chips.push(a.seconds+'s '+(a.label||'计时'));
    else if(a.type==='play_music') chips.push('音乐 · '+(a.query||''));
    else if(a.type==='navigate') chips.push('导航 · '+a.destination);
    else if(a.type==='open_url') chips.push((a.url||'').slice(0,40));
    else if(a.type==='tap_text') chips.push('点击 · '+a.text);
    else if(a.type==='type_text') chips.push('输入 · '+a.text);
    else if(a.type==='swipe') chips.push('滑动 · '+a.direction);
    else if(a.type==='weather') chips.push('天气 · '+(a.city||''));
    else if(a.type==='screen_explain') chips.push('看屏幕');
    else chips.push(a.type);
  });
  const dr = (j.device_results||[]);
  if(dr.length){
    const ok = dr.filter(r=>r.ok).length;
    const failed = dr.filter(r=>r.ok===false).length;
    chips.push(`${ok}✓${failed?' '+failed+'✗':''}`);
  }
  return chips;
}

async function sendText(t){
  if(!t.trim()) return;
  add('u', t);
  setStatus('思考中','busy');
  const typing = addTyping();
  const fd = new FormData();
  fd.append('text', t);
  fd.append('autorun', autorun ? 'true' : 'false');
  fd.append('session_id', sessionId);
  try{
    const r = await fetch('/voice/text', {method:'POST', body:fd});
    const j = await r.json();
    typing.remove();
    add('a', j.reply_text || '(空)', summary(j));
    setStatus('就绪','ok');
    setTimeout(()=>setStatus('就绪',''), 1200);
  }catch(e){
    typing.remove();
    add('a', '错误: '+e.message);
    setStatus('错误','err');
  }
}

async function sendAudio(blob){
  add('u','🎙 录音 '+(blob.size/1024).toFixed(1)+' KB');
  setStatus('识别中','busy');
  const typing = addTyping();
  const fd = new FormData();
  fd.append('audio', blob, 'rec.m4a');
  fd.append('autorun', autorun ? 'true' : 'false');
  fd.append('audio_format','b64');
  fd.append('session_id', sessionId);
  try{
    const r = await fetch('/voice/turn', {method:'POST', body:fd});
    const j = await r.json();
    typing.remove();
    if(j.user_text){
      const turns = log.querySelectorAll('.turn.u .bubble');
      if(turns.length){ turns[turns.length-1].textContent = j.user_text; }
    }
    add('a', j.reply_text||'', summary(j));
    if(j.audio_wav_b64){
      audioEl?.pause();
      audioEl = new Audio('data:audio/wav;base64,'+j.audio_wav_b64);
      audioEl.play().catch(()=>{});
    }
    setStatus('就绪','ok');
    setTimeout(()=>setStatus('就绪',''), 1200);
  }catch(e){
    typing.remove();
    add('a','错误: '+e.message);
    setStatus('错误','err');
  }
}

function updateSendActive(){ sendBtn.classList.toggle('active', txt.value.trim().length > 0); }
txt.addEventListener('input', updateSendActive);
sendBtn.onclick = ()=>{ const t=txt.value; txt.value=''; updateSendActive(); sendText(t); };
txt.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendBtn.click(); }});

autoBtn.onclick = ()=>{
  autorun = !autorun;
  autoBtn.classList.toggle('on', autorun);
  autoBtn.textContent = '自动执行' + (autorun?'':' 关');
};

document.getElementById('reset').onclick = async ()=>{
  const fd = new FormData(); fd.append('session_id', sessionId);
  try{ await fetch('/session/reset', {method:'POST', body:fd}); }catch(e){}
  log.innerHTML = '';
  log.appendChild(empty); empty.style.display = '';
  setStatus('已清空','ok');
  setTimeout(()=>setStatus('就绪',''), 1000);
};

document.querySelectorAll('#suggestions button').forEach(b=>{
  b.onclick = ()=>{ txt.value = b.textContent; updateSendActive(); sendBtn.click(); };
});

async function startRec(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
    mr = new MediaRecorder(stream, {mimeType: mime});
    chunks = [];
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = ()=>{
      const blob = new Blob(chunks, {type: mime});
      stream.getTracks().forEach(t=>t.stop());
      sendAudio(blob);
    };
    mr.start();
    mic.classList.add('rec');
    setStatus('录音中','busy');
    if(navigator.vibrate) navigator.vibrate(8);
  }catch(e){ setStatus('麦克风失败','err'); }
}
function stopRec(){
  if(mr && mr.state !== 'inactive'){ mr.stop(); }
  mic.classList.remove('rec');
  if(navigator.vibrate) navigator.vibrate(8);
}
mic.addEventListener('touchstart', e=>{e.preventDefault();startRec();});
mic.addEventListener('touchend',   e=>{e.preventDefault();stopRec();});
mic.addEventListener('touchcancel',e=>{e.preventDefault();stopRec();});
mic.addEventListener('mousedown',  startRec);
mic.addEventListener('mouseup',    stopRec);
mic.addEventListener('mouseleave', stopRec);
</script>
</body>
</html>
